name: AI Live Test

# Manual-only: calls the real DeepSeek API with the app's actual prompts and
# validators over the fixture statements. Requires the DEEPSEEK_API_KEY repo
# secret. Never runs on push/PR/schedule — it spends (tiny amounts of) real
# API credit and secrets must not be exposed to fork-triggered events.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail fast if the secret is missing
        env:
          KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Run live AI tests
        working-directory: app
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npx vitest run test/live --reporter=verbose
