name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ["app/**", "data/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:
  workflow_call:

# Deploys by pushing the built site to the gh-pages branch. The artifact-based
# Pages flow (configure-pages/deploy-pages) needs GITHUB_TOKEN to manage the
# Pages site via API, which "Resource not accessible by integration" forbids
# here; branch-based Pages needs only contents: write.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # Explicit ref: when called from data-refresh, the triggering SHA predates
      # the data commit that job just pushed; checking out main picks it up.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Push site to gh-pages
        run: |
          cd app/dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy site from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
